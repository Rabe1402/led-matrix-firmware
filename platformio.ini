; ESP32-C6 Super Mini braucht Arduino-ESP32 3.x. Die offizielle espressif32-Platform
; bietet das (noch) nicht, daher die pioarduino-Variante.
[env:esp32-c6-supermini]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

monitor_speed = 115200

; Der Super Mini hat nur USB (kein UART-Chip): Serial muss ueber USB-CDC laufen.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    fastled/FastLED@^3.9.0
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.0
